[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-dss-olist"
version = "0.3.0"
description = "Multi-Agent Decision Support System for E-Commerce Management (Olist)"
requires-python = ">=3.10"

# src/     -> mas_dss   (codebase cu, DONG BANG, khong sua)
# src-v3/  -> masdss    (codebase v3, dang phat trien)
[tool.setuptools.packages.find]
where = ["src", "src-v3"]

[tool.pytest.ini_options]
pythonpath = ["src", "src-v3"]
testpaths = ["tests-v3"]

[tool.ruff]
line-length = 100
src = ["src-v3"]
